services:
  jpy:
    image: hkim0331/jpy:3
    env_file: .env
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    entrypoint: >
      sh -c "java -jar jpy.jar"
    restart: unless-stopped

  redis:
    image: redis:8
    env_file: .env
    restart: unless-stopped
